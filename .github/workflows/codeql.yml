name: CodeQL

on:
  push:
    branches: [main]
  # pull_request scanning is ideal for this tool: it surfaces findings inline
  # on PRs and fails the check on critical/high before merge. Commented out
  # here to avoid double runs in the push-to-main demo flow. Enable it if you
  # adopt a PR-based workflow.
  # pull_request:
  #   branches: [main]
  schedule:
    - cron: '30 5 * * 1'   # weekly, Monday 05:30 UTC

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: go

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:go"